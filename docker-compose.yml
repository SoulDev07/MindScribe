version: "3.9"

services:

  # ===== INFRASTRUCTURE =====
  eureka-server:
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 25s

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  # ===== APPLICATION SERVICES =====
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      eureka-server:
        condition: service_healthy
      redis:
        condition: service_started

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/users_db
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started

  journal-service:
    build:
      context: .
      dockerfile: journal-service/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/journal_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
      - WEATHER_API_KEY=${WEATHER_API_KEY:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
      kafka:
        condition: service_started

  sentiment-service:
    build:
      context: ./sentiment-service
      dockerfile: Dockerfile
    ports:
      - "8083:8083"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - HOSTNAME=sentiment-service
    depends_on:
      eureka-server:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    ports:
      - "8084:8084"
    environment:
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
      - JAVA_EMAIL=${JAVA_EMAIL:-}
      - JAVA_EMAIL_PASSWORD=${JAVA_EMAIL_PASSWORD:-}
    depends_on:
      eureka-server:
        condition: service_healthy
      kafka:
        condition: service_started

  audit-service:
    build:
      context: .
      dockerfile: audit-service/Dockerfile
    ports:
      - "8085:8085"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/audit_db
      - EUREKA_URI=http://eureka-server:8761/eureka/
      - KAFKA_SERVERS=kafka:9092
    depends_on:
      eureka-server:
        condition: service_healthy
      mongo:
        condition: service_started
      kafka:
        condition: service_started

volumes:
  mongo_data:
